apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: db-creds-sync
  namespace: secrets-audit-demo
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: demo/db
  refreshAfter: 30s
  destination:
    name: db-creds
    create: true
    labels:
      audit-target: "true"
      synced-from: "vault"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-creds-sync
  namespace: secrets-audit-demo
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: demo/app
  refreshAfter: 30s
  destination:
    name: app-creds
    create: true
    labels:
      audit-target: "true"
      synced-from: "vault"
