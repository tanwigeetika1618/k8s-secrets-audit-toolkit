apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: secrets-audit-demo
data:
  init.sql: |
    CREATE DATABASE appdb;
    CREATE USER appuser WITH PASSWORD 'S3cretP@ssw0rd-2027!';
    GRANT ALL PRIVILEGES ON DATABASE appdb TO appuser;
    \c appdb
    CREATE TABLE IF NOT EXISTS items (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    GRANT ALL ON ALL TABLES IN SCHEMA public TO appuser;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO appuser;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: secrets-audit-demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: "S3cretP@ssw0rd-2027!"
            - name: POSTGRES_USER
              value: "postgres"
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: secrets-audit-demo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
