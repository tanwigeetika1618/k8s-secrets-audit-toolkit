apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-db-creds
  namespace: secrets-audit-demo
spec:
  provider: vault
  parameters:
    vaultAddress: "http://host.docker.internal:8200"
    roleName: "demo-app"
    objects: |
      - objectName: "db-username"
        secretPath: "secret/data/demo/db"
        secretKey: "username"
      - objectName: "db-password"
        secretPath: "secret/data/demo/db"
        secretKey: "password"
      - objectName: "db-host"
        secretPath: "secret/data/demo/db"
        secretKey: "host"
      - objectName: "db-port"
        secretPath: "secret/data/demo/db"
        secretKey: "port"
      - objectName: "db-name"
        secretPath: "secret/data/demo/db"
        secretKey: "dbname"
